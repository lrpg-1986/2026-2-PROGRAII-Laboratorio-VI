openapi: 3.0.3
info:
  title: API de Biblioteca
  description: API para administrar los libros de una biblioteca.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Servidor local

tags:
  - name: Libros
    description: Operaciones para administrar libros

paths:
  /libros:
    post:
      tags:
        - Libros
      summary: Registrar un libro
      operationId: registrarLibro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibroRequest'
      responses:
        '201':
          description: Libro registrado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Libro'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '409':
          description: Ya existe un libro con el mismo ISBN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Libros
      summary: Consultar todos los libros
      operationId: consultarLibros
      responses:
        '200':
          description: Lista de libros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Libro'

  /libros/titulo/{titulo}:
    get:
      tags:
        - Libros
      summary: Consultar libros por título
      operationId: consultarLibrosPorTitulo
      parameters:
        - name: titulo
          in: path
          required: true
          description: Título completo o parcial del libro
          schema:
            type: string
          example: Cien años de soledad
      responses:
        '200':
          description: Libros que coinciden con el título indicado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Libro'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'

  /libros/{id}:
    put:
      tags:
        - Libros
      summary: Actualizar un libro
      operationId: actualizarLibro
      parameters:
        - $ref: '#/components/parameters/LibroId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibroRequest'
      responses:
        '200':
          description: Libro actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Libro'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '409':
          description: El ISBN pertenece a otro libro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Libros
      summary: Eliminar un libro
      operationId: eliminarLibro
      parameters:
        - $ref: '#/components/parameters/LibroId'
      responses:
        '204':
          description: Libro eliminado correctamente
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'

components:
  parameters:
    LibroId:
      name: id
      in: path
      required: true
      description: Identificador del libro
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

  schemas:
    Libro:
      type: object
      required:
        - id
        - titulo
        - autor
        - isbn
        - anioPublicacion
        - estado
      properties:
        id:
          type: integer
          format: int64
          example: 1
        titulo:
          type: string
          example: Cien años de soledad
        autor:
          type: string
          example: Gabriel García Márquez
        isbn:
          type: string
          example: 978-0307474728
        anioPublicacion:
          type: integer
          minimum: 1
          example: 1967
        estado:
          $ref: '#/components/schemas/EstadoLibro'

    LibroRequest:
      type: object
      required:
        - titulo
        - autor
        - isbn
        - anioPublicacion
        - estado
      properties:
        titulo:
          type: string
          minLength: 1
          example: Cien años de soledad
        autor:
          type: string
          minLength: 1
          example: Gabriel García Márquez
        isbn:
          type: string
          minLength: 10
          example: 978-0307474728
        anioPublicacion:
          type: integer
          minimum: 1
          example: 1967
        estado:
          $ref: '#/components/schemas/EstadoLibro'

    EstadoLibro:
      type: string
      description: Estado actual del libro
      enum:
        - DISPONIBLE
        - PRESTADO
      example: DISPONIBLE

    Error:
      type: object
      required:
        - mensaje
      properties:
        mensaje:
          type: string
          example: Libro no encontrado

  responses:
    SolicitudInvalida:
      description: Los datos enviados no son válidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RecursoNoEncontrado:
      description: Libro no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
