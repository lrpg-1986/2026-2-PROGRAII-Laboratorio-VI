openapi: 3.0.3
info:
  title: API de Cursos Universitarios
  description: API para administrar cursos universitarios.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Servidor local

tags:
  - name: Cursos
    description: Operaciones para administrar cursos

paths:
  /cursos:
    post:
      tags:
        - Cursos
      summary: Crear un curso
      operationId: crearCurso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoRequest'
      responses:
        '201':
          description: Curso creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '409':
          description: Ya existe un curso con el mismo código
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Cursos
      summary: Consultar todos los cursos
      operationId: consultarCursos
      responses:
        '200':
          description: Lista de cursos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Curso'

  /cursos/codigo/{codigo}:
    get:
      tags:
        - Cursos
      summary: Consultar un curso por código
      operationId: consultarCursoPorCodigo
      parameters:
        - name: codigo
          in: path
          required: true
          description: Código único del curso
          schema:
            type: string
          example: PROG-201
      responses:
        '200':
          description: Curso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'

  /cursos/{id}:
    put:
      tags:
        - Cursos
      summary: Actualizar un curso
      operationId: actualizarCurso
      parameters:
        - $ref: '#/components/parameters/CursoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoRequest'
      responses:
        '200':
          description: Curso actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '409':
          description: El código pertenece a otro curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Cursos
      summary: Eliminar un curso
      operationId: eliminarCurso
      parameters:
        - $ref: '#/components/parameters/CursoId'
      responses:
        '204':
          description: Curso eliminado correctamente
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'

components:
  parameters:
    CursoId:
      name: id
      in: path
      required: true
      description: Identificador del curso
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

  schemas:
    Curso:
      type: object
      required:
        - id
        - nombre
        - codigo
        - creditos
        - estado
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: Programación II
        codigo:
          type: string
          example: PROG-201
        creditos:
          type: integer
          minimum: 1
          example: 4
        estado:
          $ref: '#/components/schemas/EstadoCurso'

    CursoRequest:
      type: object
      required:
        - nombre
        - codigo
        - creditos
        - estado
      properties:
        nombre:
          type: string
          minLength: 1
          example: Programación II
        codigo:
          type: string
          minLength: 1
          example: PROG-201
        creditos:
          type: integer
          minimum: 1
          example: 4
        estado:
          $ref: '#/components/schemas/EstadoCurso'

    EstadoCurso:
      type: string
      description: Estado actual del curso
      enum:
        - ACTIVO
        - INACTIVO
      example: ACTIVO

    Error:
      type: object
      required:
        - mensaje
      properties:
        mensaje:
          type: string
          example: Curso no encontrado

  responses:
    SolicitudInvalida:
      description: Los datos enviados no son válidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RecursoNoEncontrado:
      description: Curso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
